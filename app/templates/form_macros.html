{% macro render_field(field, field_class='') %}
<div class="form-group">
  {{ field.label(class="form-label") }}
  {{ field(class="form-control " ~ field_class) }}
  {% if field.errors %}
  <div class="text-danger">
    {% for error in field.errors %}
    <small>{{ error }}</small><br>
    {% endfor %}
  </div>
  {% endif %}
</div>
{% endmacro %}
