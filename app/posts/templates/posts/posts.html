{% extends 'base.html' %}

{% block title %}POSTS{% endblock %}

{% block content %}
<h1>Articles</h1>

<div class="row row-cols-1 row-cols-md-3 g-4">
  {% for post in posts %}
    <div class="col">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">
            <a href="{{ url_for('posts.detail_post', id=post['id']) }}">{{ post["title"] }}</a>
          </h5>
          <p class="card-text">{{ post["content"] }}</p>
        </div>
        <div class="card-footer">
          <small class="text-body-secondary">{{ post["publication_date"] }}</small>
        </div>
      </div>
    </div>
  {% endfor %}
</div>

{% endblock %}
