{% extends 'base.html' %}
{% block title %} Login Page {%endblock%}

{% block content %}
<main class="main">
  <form class="loginForm" method="post">
    <h2>Login</h2>
    <div class="form-floating mb-3">
      <input type="text" class="form-control" name="username" id="floatingInput" placeholder="name@example.com">
      <label for="floatingInput">Ім'я користувача</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" name="password" id="floatingPassword" placeholder="Password">
      <label for="floatingPassword">Пароль</label>
    </div>
    <input type="submit" class="formButton btn btn-primary" value="Увійти">
  
  </form>
</main>
{% endblock %}
