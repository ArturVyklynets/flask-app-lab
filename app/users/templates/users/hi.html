{% extends 'base.html' %}
{% block title %} Greeting Page {%endblock%}
{% block content %}
  <nav class="nav">
    <ul class="nav-list">
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('users.greetings', name='John', age=30) }}">Greet John</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{url_for('users.admin')}}">Admin</a>
      </li>
    </ul>
  </nav>

  <h1>Hello :)</h1>
  <h1>User {{ name | upper }}</h1>

  {% if age %}
    <h1 class="ageApproved">Age: {{ age }}</h1>
  {% else %}
    <h2 class="ageNotApproved">Age: empty</h2>
  {% endif %}
{% endblock %}
